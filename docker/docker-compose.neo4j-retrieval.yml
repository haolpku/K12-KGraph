services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_PLUGINS: ${NEO4J_PLUGINS:-[]}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      # HTTP readiness avoids authenticating during the short interval between
      # Bolt opening and the system database becoming fully ready.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  retrieval-api:
    build:
      context: ..
      dockerfile: docker/retrieval-api.Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RETRIEVAL_API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_READONLY_USER: ${NEO4J_READONLY_USER:-}
      NEO4J_READONLY_PASSWORD: ${NEO4J_READONLY_PASSWORD:-}
      K12_NEO4J_POOL_WARMUP_CONCURRENCY: ${K12_NEO4J_POOL_WARMUP_CONCURRENCY:-8}
      K12_ENV: ${K12_ENV:-development}
      K12_AUTH_MODE: ${K12_AUTH_MODE:-development}
      K12_ROUTER_MODE: ${K12_ROUTER_MODE:-cascade}
      K12_AUDIT_HMAC_KEY: ${K12_AUDIT_HMAC_KEY:-}
      K12_CORS_ORIGINS: ${K12_CORS_ORIGINS:-}
      K12_ROUTER_MODEL: ${DEEPSEEK_LLM_MODEL:-deepseek-v4-flash}
      K12_ROUTER_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      K12_ROUTER_API_KEY: ${DEEPSEEK_API_KEY:-}
      K12_RETRIEVAL_EMBEDDING_PROVIDER: ${K12_RETRIEVAL_EMBEDDING_PROVIDER:-fastembed}
      K12_RETRIEVAL_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      K12_RETRIEVAL_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      K12_RETRIEVAL_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      K12_RETRIEVAL_EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSIONS:-512}
      RETRIEVAL_API_APP: ${RETRIEVAL_API_APP:-retrieval.api:app}
      RETRIEVAL_API_WORKERS: ${RETRIEVAL_API_WORKERS:-1}
      RETRIEVAL_LOG_LEVEL: ${RETRIEVAL_LOG_LEVEL:-info}
      K12_RETRIEVAL_HYBRID_BACKEND: ${K12_RETRIEVAL_HYBRID_BACKEND:-graphrag}
    healthcheck:
      test: ["CMD", "python", "/app/docker/scripts/healthcheck_api.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
