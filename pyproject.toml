[project]
name = "k12-kgraph"
version = "0.1.0"
description = "K12 knowledge graph construction, retrieval, benchmark, and training-data pipelines"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed",
  "neo4j>=5.26,<6",
  "neo4j-graphrag>=1.18,<2",
  "numpy",
  "openai>=1.0.0",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = [
  "S101", # pytest uses assert
  "S603", # subprocess arguments are fixed repository commands
  "S607", # repository CLI tools intentionally resolve commands from PATH
]
